<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gana😍❤️👸🏻</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
      text-align: center;
      padding: 15px;
      overflow-x: hidden;
    }

    /* 1. شاشة الجواب */
    #envelope-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .envelope-title {
      font-size: 24px;
      font-weight: bold;
      color: #d63384;
      margin-bottom: 25px;
      animation: bounce 1.5s infinite;
    }

    .envelope {
      width: 150px;
      height: 100px;
      background: #ff4b2b;
      position: relative;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s;
    }

    .envelope:hover {
      transform: scale(1.08);
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      border-left: 75px solid transparent;
      border-right: 75px solid transparent;
      border-top: 50px solid #ff2a55;
    }

    .envelope-heart {
      font-size: 30px;
      z-index: 2;
    }

    /* 2. شاشة الباسورد */
    #password-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .password-card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 350px;
    }

    .password-card h3 {
      color: #d63384;
      margin-bottom: 15px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid #ff4b2b;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      outline: none;
    }

    .btn {
      background: #ff4b2b;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff2a55;
    }

    /* 3. المحتوى الرئيسي */
    #main-content {
      display: none;
      width: 100%;
      max-width: 650px;
      background: rgba(255, 255, 255, 0.93);
      padding: 25px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      margin: 20px auto;
    }

    .main-header {
      font-size: 32px;
      color: #ff2a55;
      margin-bottom: 15px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    /* مشغل الأغنية */
    .audio-player {
      margin-bottom: 25px;
      width: 100%;
    }

    audio {
      width: 100%;
      border-radius: 10px;
    }

    /* الكروت الأربعة بقلب ينبض */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 30px;
    }

    .info-card {
      background: #fff0f3;
      border: 2px solid #ffccd5;
      border-radius: 15px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 12px rgba(0,0,0,0.05);
      transition: transform 0.3s;
    }

    .info-card:hover {
      transform: translateY(-5px);
    }

    .pulsing-heart {
      font-size: 28px;
      margin-bottom: 10px;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .card-text {
      font-size: 14px;
      font-weight: bold;
      color: #c2185b;
      line-height: 1.4;
    }

    /* معرض الصور الجذاب مع السبع صور المرفوعة */
    .gallery-title {
      font-size: 20px;
      color: #d63384;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 35px;
    }

    .img-frame {
      background: white;
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }

    .img-frame:nth-child(odd) {
      transform: rotate(-2deg);
    }

    .img-frame:nth-child(even) {
      transform: rotate(2deg);
    }

    .img-frame:hover {
      transform: scale(1.06) rotate(0deg);
      z-index: 5;
    }

    .img-frame img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* قسم الرسالة المسحورة بتأثير الكتابة الحية */
    .message-section {
      margin-top: 20px;
    }

    .msg-btn {
      background: linear-gradient(45deg, #d63384, #ff4b2b);
      color: white;
      padding: 15px 25px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(214, 51, 132, 0.3);
      transition: transform 0.2s;
      width: 100%;
    }

    .msg-btn:hover {
      transform: scale(1.02);
    }

    #message-box {
      display: none;
      margin-top: 20px;
      background: #fff;
      border: 2px dashed #ff4b2b;
      padding: 20px;
      border-radius: 15px;
      font-size: 17px;
      line-height: 1.8;
      color: #333;
      font-weight: bold;
      text-align: center;
      min-height: 100px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- 1. شاشة الجواب -->
  <div id="envelope-screen" onclick="openPasswordModal()">
    <div class="envelope-title">اضغطي هنا ي روحي</div>
    <div class="envelope">
      <div class="envelope-heart">❤️</div>
    </div>
  </div>

  <!-- 2. نافذة الباسورد -->
  <div id="password-modal">
    <div class="password-card">
      <h3>ادخلي الباسورد ي روحي ❤️</h3>
      <input type="password" id="passInput" placeholder="اكتبي الباسورد هنا...">
      <button class="btn" onclick="verifyPassword()">دخول</button>
    </div>
  </div>

  <!-- 3. محتوى الموقع الرئيسي -->
  <div id="main-content">
    <h1 class="main-header">Gana😍❤️👸🏻</h1>

    <!-- مشغل الأغنية المربوط باسم song.mp3 -->
    <div class="audio-player">
      <audio id="bgMusic" controls loop>
        <source src="song.mp3" type="audio/mpeg">
      </audio>
    </div>

    <!-- الكروت الأربعة بقلب ينبض -->
    <div class="cards-grid">
      <div class="info-card">
        <div class="pulsing-heart">❤️</div>
        <div class="card-text">بحبك ي جوجو 😍❣️</div>
      </div>
      <div class="info-card">
        <div class="pulsing-heart">💖</div>
        <div class="card-text">حبي ليكي ما يتوصفش والله 😍❣️</div>
      </div>
      <div class="info-card">
        <div class="pulsing-heart">💕</div>
        <div class="card-text">بحبككك قد الكون كله 😍❣️</div>
      </div>
      <div class="info-card">
        <div class="pulsing-heart">💓</div>
        <div class="card-text">مقدرش اعيش يوم من غيرك ي روح قلبي😍❣️</div>
      </div>
    </div>

    <!-- معرض الصور المكون من الـ 7 صور الظاهرة عندك -->
    <div class="gallery-title">أجمل اللحظات 📸❤️</div>
    <div class="gallery-grid">
      <div class="img-frame"><img src="IMG_0175.jpeg" alt="صورة"></div>
      <div class="img-frame"><img src="IMG_0640.jpeg" alt="صورة"></div>
      <div class="img-frame"><img src="IMG_0642.jpeg" alt="صورة"></div>
      <div class="img-frame"><img src="IMG_1582.jpeg" alt="صورة"></div>
      <div class="img-frame"><img src="IMG_2018.jpeg" alt="صورة"></div>
      <div class="img-frame"><img src="IMG_2021.jpeg" alt="صورة"></div>
      <div class="img-frame"><img src="IMG_2027.jpeg" alt="صورة"></div>
    </div>

    <!-- قسم الرسالة والتأثير الكتابي -->
    <div class="message-section">
      <button class="msg-btn" id="showMsgBtn" onclick="startTypingMessage()">اضغطي هنا لقراءة الرسالة ❤️</button>
      <div id="message-box"></div>
    </div>
  </div>

  <script>
    function openPasswordModal() {
      document.getElementById('password-modal').style.display = 'flex';
    }

    function verifyPassword() {
      const pass = document.getElementById('passInput').value;
      if (pass === 'بحبكك') {
        document.getElementById('password-modal').style.display = 'none';
        document.getElementById('envelope-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';

        // تشغيل الأغنية تلقائياً
        const audio = document.getElementById('bgMusic');
        if (audio) {
          audio.play().catch(e => console.log("Autoplay restriction:", e));
        }
      } else {
        alert('الباسورد غير صحيح ي روحي! حاولي تاني ❤️');
      }
    }

    document.getElementById('passInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        verifyPassword();
      }
    });

    const fullMessage = "متزعليش مني ي جوجو بجد غصب عني ونا اسف وحقكك عليا ي روح قلبي ومقدرش ع زعلك والله وبحبككك قد الدنيا بحالها 😍\nبحبككك قد الكوووون😍";
    let charIndex = 0;
    let isTypingStarted = false;

    function startTypingMessage() {
      if (isTypingStarted) return;
      isTypingStarted = true;
      
      document.getElementById('showMsgBtn').style.display = 'none';
      const msgBox = document.getElementById('message-box');
      msgBox.style.display = 'block';

      function typeNextChar() {
        if (charIndex < fullMessage.length) {
          const char = fullMessage.charAt(charIndex);
          if (char === '\n') {
            msgBox.innerHTML += '<br>';
          } else {
            msgBox.innerHTML += char;
          }
          charIndex++;
          setTimeout(typeNextChar, 50);
        }
      }

      typeNextChar();
    }
  </script>
</body>
</html>
